services:
  macaujc-predictor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: macaujc-predictor:1.0.0
    container_name: macaujc-predictor
    restart: unless-stopped
    ports:
      - "8787:8000"        # 宿主 8787 → 容器 8000, 外部经此端口访问
    environment:
      TZ: Asia/Shanghai
      MACAUJC_DB: /app/data/macaujc.db   # 显式指定, 与下方卷挂载一致
    volumes:
      - ../app/data:/app/data   # SQLite 持久化: 容器内真实 DB 路径 = /app/data(契约路径)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/status',timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
